<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Museum Exploration – VirtualVerse Cosmic Archive</title>
  <meta name="description" content="Explore real-time 3D museum chambers, inspect floating holographic artifacts, teleport through dimensional portals, and immerse in the Cosmic Archive.">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/museum.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="overflow: hidden;">

  <!-- Viewport Container for WebGL Scene -->
  <div class="museum-viewport">
    <div id="museum-canvas-container"></div>
    <div id="teleport-flash" class="teleport-flash-overlay"></div>

    <!-- Center Screen Crosshair and Interaction Prompt -->
    <div class="museum-crosshair">
      <div class="crosshair-dot"></div>
      <div class="crosshair-reticle"></div>
      <div id="hud-crosshair-prompt">Inspect Exhibit</div>
    </div>

    <!-- HUD TOP BAR OVERLAY -->
    <div class="museum-hud-top">
      <div class="hud-left-group">
        <a href="index.html" class="nav-icon-btn" title="Exit to Landing Page">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="hud-sector-badge">
          <span id="hud-room-code" class="hud-sector-code">ARCH-01</span>
          <span id="hud-room-title" class="hud-sector-name">Ancient Civilization Hall</span>
        </div>
        <button id="hud-room-picker-btn" class="cyber-btn btn-ghost btn-sm" title="Sector Teleport Modal">
          <i class="fa-solid fa-door-open"></i> Teleport Sectors
        </button>
      </div>

      <div class="hud-center-group">
        <div class="hud-mode-switcher">
          <button class="mode-btn active" data-mode="fps" title="First-Person Walking (WASD + Drag Look)">
            <i class="fa-solid fa-person-walking"></i> First Person
          </button>
          <button class="mode-btn" data-mode="orbit" title="Orbit Camera Inspection">
            <i class="fa-solid fa-globe"></i> Orbit Mode
          </button>
          <button class="mode-btn" data-mode="tour" title="Cinematic Automatic Tour">
            <i class="fa-solid fa-route"></i> Auto Tour
          </button>
        </div>
      </div>

      <div class="hud-right-group">
        <button id="hud-ambient-drone-btn" class="nav-icon-btn" title="Synthesize Ambient Drone">
          <i class="fa-solid fa-satellite-dish"></i>
        </button>
        <button id="nav-audio-toggle" class="nav-icon-btn" title="Toggle Cosmic Audio">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <button id="hud-reset-cam-btn" class="nav-icon-btn" title="Reset Camera to Spawn Point">
          <i class="fa-solid fa-crosshairs"></i>
        </button>
        <button id="hud-fullscreen-btn" class="nav-icon-btn" title="Toggle Fullscreen (F)">
          <i class="fa-solid fa-expand"></i>
        </button>
        <div id="nav-user-slot"></div>
      </div>
    </div>

    <!-- HUD BOTTOM BAR (MINI-MAP & KEYBOARD GUIDE) -->
    <div class="museum-hud-bottom">
      <div class="hud-minimap-card">
        <div class="minimap-title">
          <span><i class="fa-solid fa-map-location-dot"></i> Mini-Map</span>
          <small><i class="fa-solid fa-circle" style="color:#00E5FF; font-size: 8px;"></i> You</small>
        </div>
        <canvas id="hud-minimap-canvas" width="140" height="140"></canvas>
      </div>

      <div class="hud-controls-card">
        <div class="control-key-item">
          <span class="kbd-badge">W A S D</span>
          <span>Walk</span>
        </div>
        <div class="control-key-item">
          <span class="kbd-badge">Drag Mouse</span>
          <span>Look Around</span>
        </div>
        <div class="control-key-item">
          <span class="kbd-badge">Click</span>
          <span>Inspect Relic / Portal</span>
        </div>
        <div class="control-key-item">
          <span class="kbd-badge">1 - 5</span>
          <span>Quick Teleport</span>
        </div>
        <div class="control-key-item">
          <span class="kbd-badge">F</span>
          <span>Fullscreen</span>
        </div>
      </div>
    </div>

    <!-- GUIDED TOUR PROMPT BOX (When in tour mode) -->
    <div id="hud-tour-narration"></div>

    <!-- HOLOGRAPHIC INFORMATION PANEL DRAWER (On Relic Click) -->
    <div id="holographic-info-panel" class="holographic-drawer"></div>

    <!-- SECTOR TELEPORT MODAL (When clicking Teleport Sectors) -->
    <div id="room-selector-modal" class="room-selector-modal">
      <div class="room-modal-container">
        <button class="modal-close-x modal-close">&times;</button>
        <div class="modal-header">
          <i class="fa-solid fa-door-open modal-icon"></i>
          <h3>Cosmic Archive Sector Jump</h3>
        </div>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Select a target museum dimension to immediately calibrate the spatial wormhole and teleport your presence.
        </p>

        <div id="rooms-modal-grid" class="rooms-modal-grid"></div>
      </div>
    </div>
  </div>

  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Core JavaScript Modules -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/procedural-models.js"></script>
  <script src="js/room-navigation.js"></script>
  <script src="js/museum3d.js"></script>
</body>
</html>
